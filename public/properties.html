<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property — Ledger</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%234a9ba5'/></svg>">
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="card">
    <div class="eyebrow">Ledger</div>
    <h1 style="margin:6px 0 2px;font-size:17px">Enter API key</h1>
    <p style="color:var(--muted);font-size:12px;margin:0">Stored in this browser only. It's the <code>API_KEY</code> from your <code>.env</code>.</p>
    <input id="gate-key" type="password" autocomplete="off" spellcheck="false" placeholder="API key">
    <button id="gate-go">Unlock</button>
    <p id="gate-err" class="delta down" style="font-size:12px" hidden>That key was rejected.</p>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Ledger</span>
      <span class="badge">self-hosted</span>
    </div>
    <a class="nav-item" href="index.html">Overview</a>
    <a class="nav-item" href="transactions.html">Transactions</a>
    <a class="nav-item" href="budget.html">Budget</a>
    <a class="nav-item" href="accounts.html">Accounts</a>
    <a class="nav-item" href="investments.html">Investments</a>
    <a class="nav-item" href="properties.html" aria-current="page">Property</a>
    <a class="nav-item" href="#">Rules &amp; imports</a>
    <div class="sidebar-foot" id="foot"></div>
  </nav>

  <main class="main">
    <div id="errors"></div>

    <div class="page-head">
      <div>
        <div class="eyebrow">Property</div>
        <h1 id="heading">Property</h1>
      </div>
      <select id="year"></select>
    </div>

    <section class="card" style="margin-bottom:14px">
      <div class="goals-grid" id="totals"></div>
    </section>

    <div id="properties"><div class="skeleton">Loading…</div></div>

    <section class="card" id="rental-card" hidden style="margin-top:14px">
      <div class="card-head">
        <span class="eyebrow">Rental · year to date</span>
        <span class="pct" id="rental-net"></span>
      </div>
      <div class="grid-2">
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Income by month</div>
          <div id="rental-income"></div>
        </div>
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Expenses</div>
          <div id="rental-expenses"></div>
        </div>
      </div>
      <p class="note" id="rental-note"></p>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="common.js"></script>
<script src="properties.js"></script>
</body>
</html>
